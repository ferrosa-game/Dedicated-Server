[workspace]
resolver="3"
members = ["crates/ferrosa-bin", "crates/ferrosa-map","crates/ferrosa-math", "crates/ferrosa-net", "crates/ferrosa-physics", "crates/ferrosa-protocol", "crates/ferrosa-sim"]

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["Infinity Dev"]

[profile.profiling]
inherits = "release"
debug = true

[workspace.lints.clippy]
neg_cmp_op_on_partial_ord = "allow"
approx_constant = "allow"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.229", features = [ "derive" ] }
rayon = "1.12.0"
glam = "0.34.1"
binrw = "0.15.0"
rand = "0.10"

ferrosa-map = { path = "crates/ferrosa-map", default-features = false }
ferrosa-sim = { path = "crates/ferrosa-sim", default-features = false }
ferrosa-math = { path = "crates/ferrosa-math", default-features = false }
ferrosa-net = { path = "crates/ferrosa-net", default-features = false }
ferrosa-protocol = { path = "crates/ferrosa-protocol", default-features = false }
ferrosa-physics = { path = "crates/ferrosa-physics", default-features = false }