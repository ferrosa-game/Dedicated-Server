[workspace]
resolver="3"
members = ["crates/ferrosa-bin", "crates/ferrosa-map", "crates/ferrosa-net", "crates/ferrosa-physics", "crates/ferrosa-protocol", "crates/ferrosa-sim", "crates/ferrosa-world"]

[workspace.package]
version = "0.1.3"
edition = "2024"
authors = ["Infinity Dev"]

[profile.profiling]
inherits = "release"
debug = true

[workspace.lints.clippy]
neg_cmp_op_on_partial_ord = "allow"
approx_constant = "allow"

[workspace.dependencies]
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0.229", features = [ "derive" ] }
rayon = "1.12.0"
glam = { version = "0.34.1", features = ["serde"] }
serde_json = "1.0.154"
gltf = { version = "1.4.1", default-features = false, features = ["names", "extras", "utils", "KHR_materials_unlit", "KHR_texture_transform"] }
binrw = "0.15.0"
rand = "0.10"

ferrosa-map = { path = "crates/ferrosa-map", default-features = false }
ferrosa-sim = { path = "crates/ferrosa-sim", default-features = false }
ferrosa-net = { path = "crates/ferrosa-net", default-features = false }
ferrosa-protocol = { path = "crates/ferrosa-protocol", default-features = false }
ferrosa-physics = { path = "crates/ferrosa-physics", default-features = false }
ferrosa-world = { path = "crates/ferrosa-world", default-features = false }