name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: ferrosa-dedicated-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: ferrosa-dedicated-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: ferrosa-dedicated-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bin="ferrosa-bin"
          [ "${{ matrix.os }}" = "windows-latest" ] && bin="$bin.exe"

          staging="${{ matrix.name }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/$bin" "$staging/"
          cp -r data "$staging/"

          cd "$staging" && 7z a "../$staging.zip" .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip